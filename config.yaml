parameters:
  seed: 114
  loss_weights:
    huber: 1.0
    w_mass_mmd0: 3.0
    w_mass_mmd1: 3.0
    w0_mass_mae: 5.0
    w1_mass_mae: 5.0
    dinu_pt: 0.01
    higgs_mass: 3.0
    nu_mass: 0.0
    angular_loss_mmd: 10.0

  batch_size: 256
  epochs: 1024
  learning_rate: 1.0e-4
