  num_workers: 10
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 6

data:
  categories: null
  val_frac: 0.05
  test_frac: 0.01

paths:
  saved_path: "/root/work/ww-pcres/hww_pcres_regressor_nofold"
  data_path: "/root/data/danning_h5/ypeng/mc20_qe_v4_recotruth_merged.h5"

scan:
  strategy: grid
  seed: 114
  # num_samples: 8 # for random search
  max_parallel: 10
  max_retries: 2
  gpus: "0"
  parameters:
    parameters.loss_weights.dinu_pt: [0.003, 0.01, 0.03]
    parameters.loss_weights.angular_loss_mmd: [3.0, 10.0, 30.0]
    parameters.loss_weights.higgs_mass: [1.0, 3.0, 5.0]
