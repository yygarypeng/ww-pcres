parameters:
  seed: 114
  batch_size: 256
  epochs: 1024
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 32
  early_stopping_min_delta: 0.0
  gradient_clip_val: 1.0
  adaptive_loss_weights: false
  log_loss_gradient_cosines: false
  d_model: 96
  n_heads: 4
  attention_blocks: 4
  attention_dropout: 0.1
  decoder_dropout: 0.1
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  loss_weights:
    huber: 1.0
    higgs_mass: 1.0
    alpha_mmd: 1.0
    mass_mmd: 1.0
    w_mass_huber: 0.001
    angular_mmd: 10.0
    dmet: 10.0

mmd:
  condition:
    kernel: rbf
    bandwidth_multipliers: [0.5, 1.0, 2.0]
  alpha:
    kernel: imq
    bandwidth_multipliers: [0.1, 0.25, 0.5, 1.0, 2.0]
  mass:
    kernel: imq
    bandwidth_multipliers: [0.1, 0.25, 0.5, 1.0, 2.0]
  angular:
    kernel: rbf
    bandwidth_multipliers: [0.25, 0.5, 1.0, 2.0]

data:
  categories: null

paths:
  saved_path: "outputs/run"
  data_path: "/path/to/training_data.h5"
