parameters:
  seed: 2330
  loss_weights:
    huber: 100.0
    higgs_mass: 20.0
    alpha_mmd: 0.0
    mass_mmd: 20.0
    w_mass_huber: 50.0
    angular_mmd: 600.0
    dmet: 0.0
  higgs_mass_target: 125.0
  higgs_mass_scale: 10.0
  higgs_mass_delta: 2.0

  batch_size: 512
  epochs: 1024
  learning_rate: 5.0e-5
  weight_decay: 5.0e-4
  early_stopping_patience: 32
  early_stopping_min_delta: 0.0
  angular_mmd_ramp_epochs: 0
  gradient_clip_val: 1.0
  adaptive_loss_weights: false
  log_loss_gradient_cosines: true
  d_model: 128
  n_heads: 4
  attention_blocks: 3
  attention_dropout: 0.3
  decoder_dropout: 0.3
  # dataloader settings (set num_workers > 0 only if stable)
  num_workers: 8
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4

mmd:
  local: false
  loss_transform:
    kind: sqrt
    epsilon: 1.0e-3

data:
  categories: null
  val_frac: 0.05
  test_frac: 0.01

