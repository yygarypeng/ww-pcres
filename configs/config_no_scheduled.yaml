parameters:
  seed: 2330
  loss_weights:
    huber: 150.0
    higgs_mass: 6.0
    alpha_mmd: 67.0
    mass_mmd: 99.0
    w_mass_huber: 190.0
    angular_mmd: 240.0
    dmet: 68.0
  higgs_mass_target: 125.0
  higgs_mass_scale: 10.0
  higgs_mass_delta: 2.0

  batch_size: 512
  epochs: 1024
  learning_rate: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping_patience: 32
  early_stopping_min_delta: 0.0
  physics_start_epoch: 0
  # angular_mmd_schedule:
  #   initial_multiplier: 0.1
  #   hold_epochs: 10
  #   full_weight_epoch: 80
  angular_mmd_schedule: null
  gradient_clip_val: 2.0
  adaptive_loss_weights: false
  log_loss_gradient_cosines: true
  d_model: 128
  n_heads: 4
  attention_blocks: 4
  attention_dropout: 0.2
  decoder_dropout: 0.2
  # dataloader settings (set num_workers > 0 only if stable)
  num_workers: 8
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4

mmd:
  local: true
  loss_transform:
    kind: sqrt
    epsilon: 1.0e-3

data:
  categories: null
  val_frac: 0.05
  test_frac: 0.01

