program: sweep/sweep.py
method: bayes

project: pcres-sweep

metric:
  name: val_angular_loss_mmd_loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config
  - configs/config.yaml

parameters:
  parameters.loss_weights.angular_loss_mmd:
    values: [3.0, 10.0, 30.0, 100.0]
  parameters.loss_weights.higgs_mass:
    values: [1.0, 3.0, 5.0]
  parameters.loss_weights.w_mass_mmd0:
    values: [1.0, 3.0, 5.0]
  parameters.loss_weights.w_mass_mmd1:
    values: [1.0, 3.0, 5.0]
  parameters.loss_weights.w0_mass_mae:
    values: [3.0, 10.0]
  parameters.loss_weights.w1_mass_mae:
    values: [3.0, 10.0]
